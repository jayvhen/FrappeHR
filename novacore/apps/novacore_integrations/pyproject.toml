[project]
name = "novacore_integrations"
authors = [{ name = "NovaCore Business Solutions Inc." }]
description = "NovaCore HRIS connectors: biometric push API, bank payroll API, KPI import, AD/M365 provisioning, job boards, e-signature"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
